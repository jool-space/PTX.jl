# EVIDENCE.toml — the hardware-evidence ledger.
#
# The gpu/hopper and gpu/blackwell runtime tiers run in NO CI lane (see
# CLAUDE.md "Hardware reality"): their evidence comes from manual cloud
# sessions, and without a dated record "green CI" quietly reads as more than
# it is. Each [[tier]] entry records the most recent time a tier's runtime
# sections actually executed on hardware, and on which tree. runtests.jl
# prints the record whenever it routes a tier's runtime sections to skip;
# docs/src/coverage.md renders the ledger.
#
# Update discipline: a hardware session ends by updating `last_validated`,
# `device`, `tree`, and `result` for the tiers it exercised — in the same PR
# as any fixes it produced. [[queue]] holds the standing experiment list for
# the next session on each device class, so a session is turnkey.

[[tier]]
tests = "gpu/hopper"
runtime = "cc==9.0"
evidence = "manual"
last_validated = "2026-07-29"
device = "H100 (80GB HBM3 + PCIe spot instances, CC 9.0)"
tree = "main (740d28d; #106–#116 ISA 9.4 + #109–#112 effect ceiling)"
result = "full default-routing suite 97,518/97,518 — first hopper runtime execution of the mbarrier all-asm demotion (#110), memory-widen overlay (#109), effect ceiling (#112), and the 9.4 feature set. Same session: the :observable A/B (agent/observable-h100-experiment, 525bf6c) also ran 97,518 green but emitted byte-identical PTX — LLVM ignores a dropped ~{memory} on sideeffect asm without callsite memory(...) attrs, so the run is vacuous as reorder evidence (see the branch commit message); queue items #52 (mapa u64 carrier: resolved, semantically sound) and #49 (matrix ambiguity: resolved/confirmed via two-toolkit ptxas+SASS matrix) closed with evidence. (Prior record: H200 2026-07-27, post-redesign main 9d6f1f8)"

[[tier]]
tests = "gpu/blackwell"
runtime = "cc==10|cc==11"
evidence = "manual"
last_validated = "2026-07-28"
device = "B200 (CC 10.0)"
tree = "post-redesign main (c6c3ba5; #88–#97)"
result = "full default-routing suite 91,870/91,870 incl. all tcgen05 runtime probes and blackwell GEMMs — run via Pkg.test, so the golden tier was filter-skipped (goldens run in CI). Prior records: B300 CC 10.3 2026-07-14 and B200 2026-07-12, both pre-redesign trees"

[[tier]]
tests = "gpu"
runtime = "cc>=7.0 floors up to cc==12.1"
evidence = "ci-continuous"
device = "GB10 (CC 12.1 / sm_121a), self-hosted CI runner"
result = "every push, both lanes; PTX_REQUIRE_GPU_RUNTIME fails the lane if the device goes invisible"

# ── Standing experiment queue (batch into one session per device class) ─────

# FA perf session (tcgen05-flash branch, B200 CC 10.0, 2026-07-28):
# fab_check green at scale=2.0 (maxdiff 1.55e-2, the rescale-heavy gate).
# An initially-reported S=1024 anomaly (7 TF) was a MEASUREMENT artifact —
# the first timed batch after a GPU-idle gap ran at idle clocks; fab_time
# now does time-based device warmup (branch commit 2884a17). Clean table
# (old default split): S=1024: 364, S=2048: 957, S=4096: 1052,
# S=8192: 1086 TF. Scoreboard knob NEUTRAL at every shape (FA4
# drop-the-softmax-wait falsified for this kernel). NREG sweep at
# B=1 H=8 S=8192: (144,80,144) = 1150 TF WINNER (+6%), (144,96,128) 1137,
# (128,96,160) 1133, (152,72,136) 1124, (128,112,144) 1116, old default
# (136,96,144) 1086; every n2=64 candidate fails ptxas (the CORRECTION
# warpgroup's register floor is 72 — the nreg tuple is (softmax,
# correction, mma/load)). (144,80,144) adopted as the branch default
# (c94bbda). CTA scaling is linear (~7.6 TF/CTA up to the 148-SM fill).
#
# Offline SASS diagnosis (sm_100a, 2026-07-28): the Julia/LLVM exception
# machinery does NOT inflate region floors — all 6 ArgumentError sites
# (tcgen05_descriptor field validation, once per work item in the
# mma-dispatch thread) plus ptxas's own 2 injected tcgen05 guardrail
# traps are sunk into one shared cold tail after all hot code. The
# kernel's 220/348 B spill traffic concentrates in the SOFTMAX region
# (interleaved with MUFU.EX2 / LDTM / F2FP.BF16 packing) = genuine
# arithmetic pressure at 144 regs, consistent with the sweep gradient;
# the remaining perf lever is algorithmic (reduce softmax live set,
# e.g. chunked bf16 output packing / the FA4 f32x2 path), not more
# register shuffling.

# Reference targets for the FA follow-ups (pyptx, same-box measurements):
# the pyptx 1-CTA original reports 985–1238 TF bf16 fwd hd128 (headline
# 1240, 0.92× FA4's 1231–1346) WITH the FMA-pipe exp2 emulation
# (emu_pairs 8/16) and half-granular split-P that the port deliberately
# skipped; the PTX.jl port measures 1150 TF without them. The 2-CTA
# cluster variant was correct but perf-neutral in pyptx; occ2 was an
# alloc-permit lesson, not a win.

[[queue]]
device = "B200/B300 (CC 10.x)"
items = [
    "FA perf follow-ups: sweep the now-ported f32x2 exp2 emulation knob (emu = (1, 3, 5, 7) is pyptx's headline set; fab_check gates each candidate — the poly changes numerics), then decide the 2-CTA port",
    "revalidate FA runtime after the BarrierSet arena adoption (PTX-diff-verified: init-order-only change, all other ~4,950 lines byte-identical; compile tier green)",
    "issue #50: fabric spelling sm_100a ptxas evidence + configured-CFT-endpoint semantics",
    "tcgen05 idesc builders: validate i8/f8f6f4/MX instruction-descriptor helpers (only f16bf16_f32 exists)",
]

[[queue]]
device = "H100/H200 (CC 9.0)"
items = [
    "asm-tier :observable follow-up: teach the renderer to attach callsite memory(inaccessiblemem: readwrite) attrs (LLVM.jl-verified as the real reorder lever, 2026-07-29), then re-run the A/B — dropping ~{memory} alone is inert",
]
