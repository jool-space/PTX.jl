[[family]]
section = "9.7.3"
title = "Floating-Point Instructions"
status = "generic"
opcodes = ["fma", "copysign", "rcp", "sqrt", "rsqrt", "sin", "cos", "lg2",
           "ex2", "tanh"]
notes = "Pure per-lane FP under the generic trailing-dtype rule; add/sub/mul/mad/div/abs/neg/min/max heads are owned by the §9.7.1 entry and cover the FP forms."
owner = ["src/ledgers/forms.jl"]

[[family]]
section = "9.7.3.1"
title = "Floating-Point Instructions: testp"
status = "generic"
opcodes = ["testp"]
notes = "Pure per-lane FP property test; the tail names the SOURCE type and the destination is a predicate, so the whole opcode is audited in the structured-result ledger (12 op×type forms, no legal `_` sink) instead of trailing-type inference."
owner = ["src/ledgers/forms.jl", "src/ledgers/structured_results.jl"]

# ── §9.7.4 / §9.7.5 / §9.7.6 Half, Mixed, and Alternate Precision ─────────────

[[family]]
section = "9.7.4"
title = "Half Precision Floating-Point Instructions"
status = "generic"
opcodes = []
notes = "No distinct opcode heads: add/sub/mul/fma/neg/abs/min/max/tanh/ex2 f16/f16x2/bf16 forms flow through the §9.7.1/§9.7.3 entries' FORMS contracts."

[[family]]
section = "9.7.5"
title = "Mixed Precision Floating-Point Instructions"
status = "generic"
opcodes = []
notes = "No distinct opcode heads: mixed-precision add/sub/fma forms flow through the §9.7.1/§9.7.3 entries' FORMS contracts. The PTX ISA 9.4 packed additions (f32x2/f16x2/bf16x2 add/sub/mul/fma, sm_107f) are deferred: their two-type tails end in an operand type, so they need audited scalar-result schemas before any chain spelling is admitted."

[[family]]
section = "9.7.6"
title = "Alternate Floating-Point Instructions"
status = "raw-only"
opcodes = []
notes = "New family in PTX ISA 9.4: FP8/FP6/FP4 x4 packed add/sub/mul/fma (sm_100a/sm_103a). No distinct opcode heads — the add/sub/mul/fma heads are owned by §9.7.1/§9.7.3, but their FORMS contracts must not be extended to these dtype.atype tails without review (tail names an operand type, not the result); raw-only until the packed forms get audited two-type schemas. ptxas cannot assemble ISA 9.4 until a CUDA 13.4+ compiler artifact ships."

