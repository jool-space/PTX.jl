# SURFACE.toml — the machine-checked instruction-surface inventory.
#
# One entry per PTX ISA 9.4 §9.7.x instruction family (subsection splits where
# one section's opcodes have different dispositions). Every PTX opcode head the
# project has an opinion about appears in exactly ONE entry; test/host/surface.jl
# asserts this inventory against the live code (PTX.FORMS,
# PTX.TYPED_WRAPPER_ONLY_RULES, the wrapper registry) in both directions, so
# textual expressibility is never mistaken for reviewed coverage (issue #55).
#
# status vocabulary (closed):
#   strict       — closed reviewed schemas and/or typed wrappers; unreviewed
#                  spellings fail loudly before LLVM.
#   generic      — chain-default rendering under a reviewed FORMS contract.
#   raw-only     — no FORMS entry or wrapper; the explicit `ptx"..."raw` escape
#                  (RAW_CONTRACT, maximally conservative) is the only route.
#   out-of-scope — deliberately unsupported; no FORMS entry, no wrapper, and
#                  raw use is unsanctioned (unsound or structurally
#                  inexpressible as a single asm call).
#
# `verify = true` marks entries whose disposition needs a human decision; the
# note says why. `owner` lists the src file(s) that implement the entry.
#
# docs/src/coverage.md is generated from this file at docs-build time.

# ── §9.7.1 Integer Arithmetic ─────────────────────────────────────────────────

[[family]]
section = "9.7.1"
title = "Integer Arithmetic Instructions"
status = "generic"
opcodes = ["add", "sub", "mul", "mad", "mul24", "mad24", "sad", "div", "rem",
           "abs", "neg", "min", "max", "popc", "clz", "brev", "bfe", "bfi",
           "szext", "dp4a", "dp2a", "clmad"]
notes = "Pure per-lane ALU under the generic trailing-dtype rule; the add/sub/mul/mad/div/abs/neg/min/max heads also own the floating-point (§9.7.3), half (§9.7.4), and mixed-precision (§9.7.5) variants."
owner = ["src/ledgers/forms.jl"]

[[family]]
section = "9.7.1"
title = "Integer Arithmetic Instructions: bfind, fns, bmsk"
status = "raw-only"
opcodes = ["bfind", "fns", "bmsk"]
notes = "Unregistered pending review: bfind's destination is always .u32 regardless of source width, so the trailing-type heuristic misreads its .u64 forms (loud ptxas reject, never a miscompile); fns and bmsk raw-render correctly and simply await a reviewed FORMS entry."

# ── §9.7.2 Extended-Precision Integer Arithmetic ──────────────────────────────

[[family]]
section = "9.7.2"
title = "Extended-Precision Integer Arithmetic Instructions"
status = "strict"
opcodes = ["addc", "subc", "madc"]
notes = "Implicit CC.CF cannot cross an LLVM inline-asm call boundary: chain AND raw are rejected by the semantic guard; typed wrappers expose the flag explicitly or fuse the operation. The add.cc/sub.cc/mad.cc spellings live under the §9.7.1 heads and hit the same guard."
owner = ["src/wrappers/extended_precision.jl", "src/ledgers/implicit_state.jl"]

