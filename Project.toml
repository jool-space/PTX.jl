name = "PTX"
uuid = "7a3554bf-f3bf-40cd-9a57-3cf23ff3bbf8"
version = "0.1.0-DEV"
authors = ["Anton Oresten <antonoresten@proton.me>"]

[workspace]
projects = ["test", "docs"]

[deps]
EnumX = "4e289a0a-7415-4d19-859d-a7e5c4648b56"
LLVM = "929cbde3-209d-540e-8aea-75f648917ca0"
Republic = "27243419-9dde-4721-b67c-fd63626fea7f"

[weakdeps]
CUDACore = "bd0ed864-bdfe-4181-a5ed-ce625a5fdea2"
NVPTX_LLVM_Backend_jll = "ef6e0fe3-e6ef-59c0-bde6-4989574699e0"

[extensions]
PTXCUDACoreExt = "CUDACore"

[compat]
CUDACore = "6.2"
EnumX = "1"
LLVM = "9.7.1"
# The NVVM registry (src/nvvm/table.jl) is generated from the backend's
# IntrinsicsNVVM.td and is valid within that backend major. The weakdep
# compat constrains any environment that carries the backend (i.e. every
# CUDA 6.2+ environment) without forcing the ~60 MB artifact on host-only
# use. Bumping this means regenerating the registry (gen/) and reviewing
# the diff; standing conformance lives in test/host/conformance.jl.
NVPTX_LLVM_Backend_jll = "22"
Republic = "2"
julia = "1.10"
